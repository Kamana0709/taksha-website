<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2100 2970" width="2100" height="2970">
  <!-- A4 Size Letterhead: 210x297mm scaled up to 2100x2970 for high res -->
  
  <!-- Background -->
  <rect width="2100" height="2970" fill="#FFFFFF" />

  <!-- Top Accent Bar -->
  <rect width="2100" height="20" fill="#0F172A" />
  <rect x="0" y="20" width="300" height="8" fill="#F59E0B" />

  <!-- Header Section -->
  <!-- Logo -->
  <g transform="translate(200, 200)">
    <polygon points="0,-30 25,15 -25,15" fill="#0F172A"/>
    <polygon points="0,20 10,30 0,40 -10,30" fill="#F59E0B"/>
    <text x="45" y="20" font-family="'Fraunces', serif" font-size="48" font-weight="600" fill="#0F172A" letter-spacing="4">TAKSHA</text>
  </g>

  <!-- Header Contact Info (Right Aligned) -->
  <g font-family="'Inter', sans-serif" font-size="20" fill="#64748B" text-anchor="end" transform="translate(1900, 190)">
    <text x="0" y="0">taksha.studio</text>
    <text x="0" y="35">hello@taksha.studio</text>
    <text x="0" y="70">+1 (555) 123-4567</text>
  </g>

  <!-- Divider -->
  <line x1="200" y1="350" x2="1900" y2="350" stroke="#E2E8F0" stroke-width="2" />

  <!-- Body Guidelines (Invisible in final, just for reference or light watermark) -->
  <rect x="200" y="450" width="1700" height="2100" fill="none" stroke="#F8FAFC" stroke-width="2"/>
  
  <!-- Content Placeholder Lines -->
  <g stroke="#F1F5F9" stroke-width="4" stroke-linecap="round">
    <line x1="200" y1="450" x2="700" y2="450" />
    <line x1="200" y1="490" x2="600" y2="490" />
    
    <line x1="200" y1="580" x2="1000" y2="580" stroke="#CBD5E1" stroke-width="6"/>

    <line x1="200" y1="650" x2="1800" y2="650" />
    <line x1="200" y1="700" x2="1900" y2="700" />
    <line x1="200" y1="750" x2="1850" y2="750" />
    <line x1="200" y1="800" x2="1600" y2="800" />
    
    <line x1="200" y1="900" x2="1900" y2="900" />
    <line x1="200" y1="950" x2="1800" y2="950" />
    <line x1="200" y1="1000" x2="1850" y2="1000" />
    <line x1="200" y1="1050" x2="1700" y2="1050" />
  </g>

  <!-- Footer Section -->
  <line x1="200" y1="2700" x2="1900" y2="2700" stroke="#E2E8F0" stroke-width="2" />
  
  <g font-family="'Inter', sans-serif" font-size="18" fill="#94A3B8" transform="translate(200, 2780)">
    <text x="0" y="0">Taksha Digital Craft Studio</text>
    <text x="0" y="30">123 Design District, Creative City, CA 90210</text>
  </g>
  
  <g font-family="'Inter', sans-serif" font-size="18" fill="#94A3B8" text-anchor="end" transform="translate(1900, 2780)">
    <text x="0" y="0">CONFIDENTIAL</text>
  </g>
</svg>
