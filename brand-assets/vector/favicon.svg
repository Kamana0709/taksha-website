<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#0F172A" />
      <stop offset="100%" stopColor="#0A0F1C" />
    </linearGradient>
    <linearGradient id="amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#F59E0B" />
      <stop offset="100%" stopColor="#D97706" />
    </linearGradient>
  </defs>
  
  <!-- Base rounded rect for App Icon/Favicon -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />

  <!-- Center abstract mark -->
  <g transform="translate(256, 256) scale(2)">
    <polygon points="0,-45 40,20 -40,20" fill="none" stroke="url(#amber)" stroke-width="3" opacity="0.8"/>
    <polygon points="0,-20 20,10 -20,10" fill="url(#amber)" opacity="1"/>
    <polygon points="0,25 15,40 0,55 -15,40" fill="url(#amber)" opacity="0.5"/>
  </g>
</svg>
